services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tarbiyat
      POSTGRES_PASSWORD: tarbiyat
      POSTGRES_DB: tarbiyat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarbiyat -d tarbiyat"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      # Override this in any real deployment. The app refuses to boot in
      # production with the default value.
      SECRET_KEY: ${SECRET_KEY:-change-me-before-deploying-please}
      DATABASE_URL: postgresql+psycopg://tarbiyat:tarbiyat@db:5432/tarbiyat
      PORT: "8000"
      MAX_UPLOAD_BYTES: "8388608"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
